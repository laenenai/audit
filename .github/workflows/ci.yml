name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Pinned by commit; Renovate updates the comment and SHA together.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # api-diff needs tags to find the previous release.
          fetch-depth: 0

      # mise.toml is the single source of tool versions. This installs Go,
      # sqlc, gofumpt and golangci-lint, then runs the same gate a developer
      # runs locally. govulncheck, apidiff and gorelease are run at pinned
      # versions by their tasks.
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          install: true
          cache: true

      - name: check
        # api-diff reports pre-1.0 breaking changes but does not fail on them.
        # Set API_DIFF_STRICT=1 here after 1.0.
        run: mise run check
