# Toolchain and tasks for a shared laenen-ai module.
#
# This file is the single source of tool versions. CI installs mise and runs
# `mise run check`; it does not pin gofumpt, golangci-lint or sqlc a second
# time in workflow YAML.
#
# Derived from cas/mise.toml but deliberately NOT a copy: cas's migrate, dev,
# up, down, reset, db and observability tasks reference ./cmd/casd and
# deploy/compose/, neither of which exists in a library module, and its
# `generate` task also runs buf, which this module has no protobuf for. A task
# list with dangling entries trains people to ignore task lists.
#
# A module that later grows migrations or generated code adds the task it
# actually needs, with the same name and meaning cas uses — which is what
# `generate` is now: this module has sqlc queries, so it runs sqlc, and only
# sqlc.

[tools]
go            = "1.27.3"
golangci-lint = "2.15.0"
gofumpt       = "0.12.0"
# sqlc is pinned because the generated code is committed and its header
# records the version that wrote it: an unpinned generator makes every
# developer's `generate` a diff. cas is on 1.31.1; this module is on the
# version that generated what is in internal/pglog/gen, and the two converge
# the next time either is bumped deliberately.
sqlc          = "1.30.0"

[env]
CGO_ENABLED = "0"

[tasks.fmt]
run = "gofumpt -l -w $(find . -path ./.claude -prune -o -name '*.go' -print)"

[tasks.fmt-check]
run = "test -z \"$(gofumpt -l $(find . -path ./.claude -prune -o -name '*.go' -print))\""

[tasks.lint]
run = "golangci-lint run"

[tasks.test]
description = "Inner loop: no containers, no databases. Skips at run time, never behind a build tag."
run = "go test ./... -short"

[tasks.build]
description = "Proves the shipped binary is cgo-free: inherits CGO_ENABLED=0 from [env]."
run = "go build ./..."

[tasks.test-all]
description = "Full suite including container- and database-backed tests."
# CGO_ENABLED=0 is a *release* constraint (cgo-free, cross-compilable binary),
# not a test constraint. The race detector needs cgo, and race detection is
# worth more in tests than cgo-freedom is; the cgo-free property is verified by
# the `build` task, which `check` also depends on.
env = { CGO_ENABLED = "1" }
run = "go test ./... -race"

[tasks.generate]
description = "Regenerate internal/pglog/gen from db/queries against db/migrations."
# Plain `sqlc generate`, not a form guarded on sqlc.yaml existing: the module
# has one now, the generated code is committed and part of the build, and a
# trailing `|| echo` would turn a generation failure into a task that
# succeeded while printing a message nobody reads.
run = "sqlc generate"

[tasks.generate-check]
description = "Fail if generated sqlc code or the query/schema inputs are stale."
run = "sqlc diff"

[tasks.vuln]
description = "Report reachable Go vulnerabilities."
run = "go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./..."

[tasks.api-diff]
description = "Compare the importable API with the last root tag using apidiff."
run = "bash scripts/api-diff.sh"

[tasks.release-check]
description = "Validate a clean release tree with gorelease (run from a clean checkout)."
run = "go run golang.org/x/exp/cmd/gorelease@v0.0.0-20261014143641-f0251eb4aa3e -base=latest"

[tasks.check]
depends = ["fmt-check", "lint", "build", "test-all", "generate-check", "vuln", "api-diff"]
